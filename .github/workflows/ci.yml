name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Format
        run: nix develop -c cargo fmt --all -- --check
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Test
        run: nix develop -c cargo test --workspace --all-features --locked
      - name: Dependency policy
        run: nix develop -c cargo deny --locked check advisories bans licenses sources
      - name: Process and release-version acceptance
        run: |
          nix develop -c cargo build --bin airsonos2 --locked
          nix develop -c python3 scripts/test-process-lifecycle.py --binary target/debug/airsonos2
          nix develop -c python3 scripts/test-release-version.py

  images:
    name: Images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Generic Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          tags: airsonos2-check:generic
          load: true
          cache-from: type=gha,scope=generic-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=generic-${{ matrix.arch }}
      - name: Home Assistant Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airsonos2/Dockerfile
          tags: airsonos2-check:home-assistant
          load: true
          cache-from: |
            type=gha,scope=generic-${{ matrix.arch }}
            type=gha,scope=home-assistant-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=home-assistant-${{ matrix.arch }}
      - name: Smoke-test both native images
        run: |
          for image in airsonos2-check:generic airsonos2-check:home-assistant; do
            docker run --rm --entrypoint /usr/local/bin/airsonos2 "$image" --version
            docker image inspect --format '{{.Id}} {{.Architecture}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          done

  vendor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ap2,resample", "video,hls"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/shairplay
          key: vendor-${{ matrix.features }}
      - name: Test standalone receiver
        env:
          VENDOR_FEATURES: ${{ matrix.features }}
        run: nix develop -c cargo test --manifest-path vendor/shairplay/Cargo.toml --features "$VENDOR_FEATURES" --locked
      - name: Standalone receiver dependency policy
        if: matrix.features == ''
        run: nix develop -c cargo deny --manifest-path vendor/shairplay/Cargo.toml --locked check advisories bans licenses sources
