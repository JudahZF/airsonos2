[server]
bind = "0.0.0.0"
# IP address advertised to Sonos in stream URLs. Optional when bind is a specific
# address or the local IP can be inferred; required if the bridge cannot infer
# a LAN IP reachable by Sonos (e.g. multi-homed hosts or unusual routing).
# advertise_addr = "192.168.1.10"
http_port = 7000
state_dir = "/var/lib/airsonos2"
log_level = "info"

[airplay]
name_template = "{room} AirSonos2"
# AirPlay hardware model advertised to Apple clients. HomePod mini is AudioAccessory5,1.
advertised_model = "AudioAccessory5,1"
pin = "3939"
# Optional legacy RTSP digest password. Leave unset for normal AirPlay 2 pairing.
# rtsp_password = "secret"
base_rtsp_port = 5000
output_sample_rate = 48000
output_channels = 2
# AirPlay 2 may open several RTSP/event connections for a single playback session.
max_clients_per_zone = 10

[sonos]
auto_discover = true
static_ips = []
include_rooms = []
exclude_rooms = []
force_standalone_on_start = true
stop_on_disconnect = true
volume_mode = "sonos"

[stream]
# Use "wav" to bypass MP3 encoding for lower startup latency if your Sonos devices accept it.
codec = "mp3"
mp3_bitrate_kbps = 320
prebuffer_ms = 500
# Optional Sonos startup wait override. Leave unset to use min(prebuffer_ms, 250).
# Lower values reduce start delay; WAV streams still skip early PCM so playback starts near live time.
# startup_wait_ms = 250
http_chunked = true
icy_metadata = true
ffmpeg_path = "ffmpeg"

[diagnostics]
metrics_addr = "0.0.0.0:9100"

[sync]
default_offset_ms = 0
multi_select_window_ms = 750
start_deadline_ms = 2500
startup_compensation = true
startup_sample_limit = 20
startup_min_samples = 3
startup_max_compensation_ms = 1000
play_command_spread_warn_ms = 80

[sync.zone_offsets_ms]
# "Kitchen" = 120
# "Office" = 80
