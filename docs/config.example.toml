[server]
bind = "0.0.0.0"
# IP address advertised to speakers in stream URLs. Optional when bind is a specific
# address or the local IP can be inferred; required if the bridge cannot infer
# a LAN IP reachable by the speakers (e.g. multi-homed hosts or unusual routing).
# Home Assistant players use the default-route address unless this is set.
# An IPv6 advertise_addr also needs bind = "::".
# advertise_addr = "192.168.1.10"
http_port = 7000
state_dir = "/var/lib/airsonos2"
log_level = "info"

[airplay]
name_template = "{room} AirSonos2"
# AirPlay hardware model advertised to Apple clients. HomePod mini is AudioAccessory5,1.
advertised_model = "AudioAccessory5,1"
pin = "3939"
# Legacy AP1 is disabled unless this digest password is configured. AP2 uses pairing.
# rtsp_password = "secret"
base_rtsp_port = 5000
output_sample_rate = 48000
output_channels = 2
# AirPlay 2 may open several RTSP/event connections for a single playback session.
max_clients_per_zone = 10

[sonos]
auto_discover = true
static_ips = []
include_rooms = []
exclude_rooms = []
force_standalone_on_start = true
volume_mode = "sonos"

[home_assistant]
# Home Assistant media_player entities to expose as AirPlay 2 speakers. Music Assistant
# players are media_player entities too. An empty list disables Home Assistant.
# url = "http://homeassistant.local:8123"
# Long-lived access token. When unset, the SUPERVISOR_TOKEN env var is used.
# token = "..."
media_players = []

[stream]
# Use "wav" to bypass MP3 encoding for lower startup latency if your Sonos devices accept it.
codec = "mp3"
mp3_bitrate_kbps = 320
prebuffer_ms = 500
# Optional Sonos startup wait override. Leave unset to use min(prebuffer_ms, 250).
# WAV publishes its header early and holds PCM until the cohort releases it.
# startup_wait_ms = 250
http_chunked = true
icy_metadata = true
ffmpeg_path = "ffmpeg"

[diagnostics]
# Also serves the config web GUI.
metrics_addr = "0.0.0.0:9100"
# The GUI answers IP addresses and local names (single-label, .local, .lan, .home.arpa,
# .internal). Add any other host name you use to open it.
allowed_hosts = []

[sync]
# Fallback measured latency for rooms without explicit entries, not an added delay.
default_offset_ms = 0
multi_select_window_ms = 750
start_deadline_ms = 2500
play_command_spread_warn_ms = 80

[sync.zone_offsets_ms]
# Positive means measured late. WAV delays faster rooms; MP3 offsets are unsupported.
# "Kitchen" = 120
# "Office" = 80
