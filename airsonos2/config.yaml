name: AirSonos2
slug: airsonos2
version: "0.1.0"
description: AirPlay 2 bridge for legacy Sonos rooms
url: https://github.com/judahfuller/airsonos2
image: ghcr.io/judahfuller/airsonos2
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
stage: experimental
backup: cold
watchdog: http://[HOST]:7000/healthz
options:
  log_level: info
  run_doctor_on_start: false
  advertise_addr: null
  name_template: "{room} AirSonos2"
  advertised_model: AudioAccessory5,1
  pin: "3939"
  rtsp_password: ""
  base_rtsp_port: 5000
  output_sample_rate: 48000
  output_channels: 2
  max_clients_per_zone: 10
  auto_discover: true
  static_ips: []
  include_rooms: []
  exclude_rooms: []
  force_standalone_on_start: true
  stop_on_disconnect: true
  stream_codec: mp3
  mp3_bitrate_kbps: 320
  prebuffer_ms: 500
  startup_wait_ms: null
  default_offset_ms: 0
  multi_select_window_ms: 750
  start_deadline_ms: 2500
  startup_compensation: true
  startup_sample_limit: 20
  startup_min_samples: 3
  startup_max_compensation_ms: 1000
  play_command_spread_warn_ms: 80
  zone_offsets: []
schema:
  log_level: list(trace|debug|info|warn|error)
  run_doctor_on_start: bool
  advertise_addr: str?
  name_template: str(1,)
  advertised_model: str(1,)
  pin: str(0,)
  rtsp_password: password?
  base_rtsp_port: port
  output_sample_rate: int(8000,)
  output_channels: int(1,8)
  max_clients_per_zone: int(1,)
  auto_discover: bool
  static_ips:
    - str
  include_rooms:
    - str
  exclude_rooms:
    - str
  force_standalone_on_start: bool
  stop_on_disconnect: bool
  stream_codec: list(mp3|wav)
  mp3_bitrate_kbps: int(32,320)
  prebuffer_ms: int(0,)
  startup_wait_ms: int(0,)?
  default_offset_ms: int
  multi_select_window_ms: int(0,)
  start_deadline_ms: int(0,)
  startup_compensation: bool
  startup_sample_limit: int(1,)
  startup_min_samples: int(1,)
  startup_max_compensation_ms: int(0,)
  play_command_spread_warn_ms: int(0,)
  zone_offsets:
    - zone: str(1,)
      offset_ms: int
