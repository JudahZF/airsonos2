name: AirSonos2
slug: airsonos2
version: "0.2.0"
description: AirPlay 2 bridge for legacy Sonos rooms and Home Assistant media players
url: https://github.com/judahfuller/airsonos2
image: ghcr.io/judahfuller/airsonos2
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
homeassistant_api: true
stage: experimental
backup: cold
watchdog: http://[HOST]:7000/healthz
options:
  log_level: info
  http_bind: "0.0.0.0"
  diagnostics_addr: "0.0.0.0:9100"
  run_doctor_on_start: false
  advertise_addr: null
  name_template: "{room} AirSonos2"
  advertised_model: AudioAccessory5,1
  pin: "3939"
  rtsp_password: ""
  base_rtsp_port: 5000
  output_sample_rate: 48000
  output_channels: 2
  max_clients_per_zone: 10
  auto_discover: true
  static_ips: []
  include_rooms: []
  exclude_rooms: []
  force_standalone_on_start: true
  ha_media_players: []
  stream_codec: mp3
  mp3_bitrate_kbps: 320
  prebuffer_ms: 500
  startup_wait_ms: null
  default_offset_ms: 0
  multi_select_window_ms: 750
  start_deadline_ms: 2500
  play_command_spread_warn_ms: 80
  zone_offsets: []
schema:
  log_level: list(trace|debug|info|warn|error)
  http_bind: str
  diagnostics_addr: str
  run_doctor_on_start: bool
  advertise_addr: str?
  name_template: str(1,)
  advertised_model: str(1,)
  pin: str(0,)
  rtsp_password: password?
  base_rtsp_port: port
  output_sample_rate: int(8000,192000)
  output_channels: int(1,2)
  max_clients_per_zone: int(1,)
  auto_discover: bool
  static_ips:
    - str
  include_rooms:
    - str
  exclude_rooms:
    - str
  force_standalone_on_start: bool
  ha_media_players:
    - match(^media_player\.[a-z0-9_]+$)
  stream_codec: list(mp3|wav)
  mp3_bitrate_kbps: int(32,320)
  prebuffer_ms: int(0,)
  startup_wait_ms: int(0,)?
  default_offset_ms: int(-10000,10000)
  multi_select_window_ms: int(0,60000)
  start_deadline_ms: int(0,60000)
  play_command_spread_warn_ms: int(0,)
  zone_offsets:
    - zone: str(1,)
      offset_ms: int(-10000,10000)
