[graph]
all-features = true
# These are the supported runtime/development platforms. The vendored desktop
# example also has WASM-only dependencies, but this project does not ship WASM.
targets = [
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin", "aarch64-apple-darwin",
]

[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin attack — no fix available (rsa 0.10 is RC)
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-3.0-or-later", # Vendored shairplay; retain its source and license notices.
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
